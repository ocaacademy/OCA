<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สถาบันสอนภาษาจีนและวัฒนธรรมจีนที่มีประสบการณ์ (Oriental Culture Academy — 東方文化書院)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-dark: #08783d;
      --green-deep: #054c27;
      --gold-primary: #d7a600;
      --gold-light: #f7d24c;
      --text: #1d3324;
      --bg-cream: #edf7ec;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* เต็มหน้าจอ 100% ไร้รอยต่อ ชิดขอบทุกด้าน ซ่อน Scrollbar ทุกเบราว์เซอร์ */
    html, body {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      background: var(--bg-cream);
      font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* Container ชิดขอบ 100vw x 100vh */
    .container {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background: var(--bg-cream);
      display: block;
      overflow: hidden !important;
      position: relative;
    }

    /* Wrapper ขยายเต็มความกว้างและความสูง 100vw x 100vh */
    .landing-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: block;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* รูปภาพความละเอียดสูง 2K เกลี่ยขอบเนียนเรียบด้วย Anti-aliasing ไม่แตกเป็นเม็ดพิกเซล */
    .landing-img {
      width: 100%;
      height: 100%;
      display: block;
      margin: 0;
      padding: 0;
      border: none;
      image-rendering: auto;
      image-rendering: smooth;
    }

    /* ปุ่ม WELCOME ล็อคพิกัดสัมพัทธ์ตรงกับปุ่มในรูป 100% ทุกขนาดจอ (left: 6.83%, top: 60.94%, width: 18.02%, height: 7.29%) */
    .welcome-btn-overlay {
      position: absolute;
      top: 60.94%;
      left: 6.83%;
      width: 18.02%;
      height: 7.29%;
      border-radius: 50px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(8, 120, 61, 0.0);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      outline: none;
      z-index: 10;
    }

    .welcome-btn-overlay:hover {
      background: rgba(247, 210, 76, 0.15);
      box-shadow: 0 0 25px rgba(247, 210, 76, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.4);
      transform: scale(1.02);
    }

    .welcome-btn-overlay:active {
      transform: scale(0.98);
      background: rgba(247, 210, 76, 0.25);
    }

    /* วงแหวนสีทองเรืองแสงรอบปุ่มพอดี */
    .pulse-ring {
      position: absolute;
      inset: -3px;
      border-radius: 50px;
      border: 2px solid var(--gold-light);
      animation: pulseGlow 2.2s infinite cubic-bezier(0.4, 0, 0.6, 1);
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0% {
        opacity: 0.9;
        transform: scale(0.99);
      }
      50% {
        opacity: 0.2;
        transform: scale(1.04);
      }
      100% {
        opacity: 0.9;
        transform: scale(0.99);
      }
    }

    /* Toast แจ้งเตือนสไลด์จากขวา พร้อม Progress bar */
    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      transform: translateX(120%);
      background: #08783d;
      color: #ffffff;
      padding: 16px 24px 20px 24px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      font-size: 15px;
      font-weight: 500;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1.5px solid var(--gold-light);
      overflow: hidden;
      max-width: 420px;
    }

    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }

    .toast-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: var(--gold-light);
      width: 100%;
      transform-origin: left;
      transform: scaleX(1);
    }

    .toast.show .toast-progress {
      animation: toastProgress 0.9s linear forwards;
    }

    @keyframes toastProgress {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="landing-wrapper">
      <img class="landing-img" src="oca_welcome_dongfang_2k_clean.jpg" alt="東方文化書院 — Oriental Culture Academy">
      
      <a class="welcome-btn-overlay" href="javascript:void(0);" onclick="onWelcomeClick()" title="WELCOME - คลิกเพื่อเข้าสู่เว็บไซต์">
        <div class="pulse-ring"></div>
      </a>
    </div>
  </div>

  <div id="toast" class="toast">
    <span style="font-size: 20px;">🌸</span>
    <span>ยินดีต้อนรับสู่ 東方文化書院 (OCA)! กำลังนำทางเข้าสู่หน้าถัดไป...</span>
    <div class="toast-progress"></div>
  </div>

  <script>
    function onWelcomeClick() {
      const toast = document.getElementById('toast');
      if (toast) toast.classList.add('show');
      
      setTimeout(() => {
        if (window.location.hostname.includes('script.google.com')) {
          const url = window.location.href.split('?')[0] + '?page=dashboard';
          if (window.top) { window.top.location.href = url; }
          else { window.location.href = url; }
        } else {
          // GitHub Pages or Local
          window.location.href = 'index.html';
        }
      }, 800);
    }
  </script>
</body>
</html>
