<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Oriental Culture Academy (東方文化書院)</title>
  
  <!-- Viewport & Mobile Standalone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#01231C">
  
  <!-- Apple iOS Standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OCA">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  
  <!-- Favicon & PWA Manifest -->
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="manifest" href="./manifest.json">
  
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #01231C;
      font-family: 'Prompt', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Iframe Shell */
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #03332A 0%, #01231C 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45));
      animation: pulse 2s infinite ease-in-out;
    }

    .splash-title {
      margin-top: 20px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #FAF0D7;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .splash-sub {
      font-size: 0.88rem;
      color: #E5CCA2;
      margin-top: 6px;
      font-weight: 400;
      text-align: center;
    }

    .spinner {
      margin-top: 26px;
      width: 34px;
      height: 34px;
      border: 3px solid rgba(229, 204, 162, 0.2);
      border-top-color: #FAF0D7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* Floating Install Banner (Android) */
    #install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      width: calc(100% - 32px);
      max-width: 440px;
      background: rgba(3, 51, 42, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(229, 204, 162, 0.45);
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(229, 204, 162, 0.15);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10000;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #install-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    .install-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      object-fit: contain;
      background: #01231C;
      border: 1px solid rgba(229, 204, 162, 0.3);
      padding: 4px;
    }

    .install-info {
      flex: 1;
    }

    .install-info h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #FAF0D7;
    }

    .install-info p {
      font-size: 0.78rem;
      color: #A7F3D0;
      margin-top: 2px;
    }

    .install-btn {
      background: linear-gradient(135deg, #FFF8E7 0%, #FAF0D7 35%, #E5CCA2 70%, #CBB279 100%);
      color: #01231C;
      border: none;
      padding: 9px 18px;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(229, 204, 162, 0.35);
      font-family: inherit;
      transition: transform 0.15s;
    }

    .install-btn:active {
      transform: scale(0.95);
    }

    .close-btn {
      background: none;
      border: none;
      color: #E5CCA2;
      font-size: 1.15rem;
      cursor: pointer;
      padding: 6px;
    }

    /* iOS Guide Prompt */
    #ios-prompt {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 440px;
      background: rgba(3, 51, 42, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(229, 204, 162, 0.15);
      z-index: 10000;
      display: none;
      text-align: center;
      border: 1.5px solid rgba(229, 204, 162, 0.45);
    }

    #ios-prompt.show {
      display: block;
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(50px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Loading Splash Screen -->
  <div id="splash-screen">
    <img src="./icon-192.png" alt="OCA Logo" class="splash-logo">
    <div class="splash-title">Oriental Culture Academy</div>
    <div class="splash-sub">東方文化書院 — กำลังเปิดระบบบริหารจัดการ...</div>
    <div class="spinner"></div>
  </div>

  <!-- Google Apps Script Embedded Iframe (Web App v32) -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxkC3uubyG3GELrSRW-DEGTH3gHWyM5oyJXUTAD1Dio__ItmwCkm-rwxGtOFNpSkH04WQ/exec"
    allow="geolocation; microphone; camera; midi; vr; accelerometer; gyroscope; payment; ambient-light-sensor"
    onload="hideSplash()"
  ></iframe>

  <!-- Android Native Install Banner -->
  <div id="install-banner">
    <img src="./icon-192.png" alt="OCA Icon" class="install-icon">
    <div class="install-info">
      <h4>ติดตั้งแอป OCA</h4>
      <p>เพิ่มลงหน้าจอมือถือเพื่อใช้งานสะดวกขึ้น</p>
    </div>
    <button class="install-btn" id="btn-install">ติดตั้ง</button>
    <button class="close-btn" onclick="dismissBanner()"><i class="fas fa-times"></i></button>
  </div>

  <!-- iOS Add to Home Instruction -->
  <div id="ios-prompt">
    <div style="font-weight: 700; font-size: 0.98rem; margin-bottom: 8px; color: #FAF0D7;">📲 ติดตั้งแอปบน iPhone / iPad</div>
    <p style="font-size: 0.84rem; color: #A7F3D0; line-height: 1.5;">
      แตะปุ่มแชร์ <i class="fa-solid fa-arrow-up-from-bracket" style="color:#FAF0D7; margin: 0 4px;"></i> ด้านล่าง แล้วเลือก <b>"เพิ่มไปยังหน้าจอโฮม (Add to Home Screen)"</b>
    </p>
    <button onclick="document.getElementById('ios-prompt').classList.remove('show')" style="margin-top: 12px; background: rgba(229, 204, 162, 0.2); border: 1px solid rgba(229, 204, 162, 0.4); padding: 6px 18px; border-radius: 10px; font-size: 0.8rem; color: #FAF0D7; cursor: pointer; font-family: inherit;">รับทราบ</button>
  </div>

  <script>
    // ซ่อนหน้า Splash เมื่อ Iframe โหลดเสร็จ หรือ Safety Timeout
    let splashHidden = false;
    function hideSplash() {
      if (splashHidden) return;
      splashHidden = true;
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('hidden');
      }, 600);
    }

    // ระบบ Safety Timeout ป้องกันหน้าค้างหากเครือข่ายโหลด iframe นานเกิน 4 วินาที
    setTimeout(() => {
      hideSplash();
    }, 4500);

    // ลงทะเบียน Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker Registered:', reg.scope))
          .catch((err) => console.error('Service Worker Error:', err));
      });
    }

    // จัดการ Event ติดตั้งแอป (Android Chrome)
    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    const btnInstall = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(() => {
        if (!isInStandaloneMode()) {
          installBanner.classList.add('show');
        }
      }, 1500);
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to install prompt: ${outcome}`);
        deferredPrompt = null;
        installBanner.classList.remove('show');
      }
    });

    function dismissBanner() {
      installBanner.classList.remove('show');
    }

    // ตรวจสอบอุปกรณ์ iOS เพื่อแนะนำการติดตั้ง
    const isIos = () => {
      const userAgent = window.navigator.userAgent.toLowerCase();
      return /iphone|ipad|ipod/.test(userAgent);
    };
    const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);

    if (isIos() && !isInStandaloneMode()) {
      setTimeout(() => {
        document.getElementById('ios-prompt').classList.add('show');
      }, 2500);
    }
  </script>
</body>
</html>
