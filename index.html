  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      background-color: #01231C;
      -webkit-font-smoothing: antialiased;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      display: block;
      z-index: 1;
    }

    /* =========================================================================
       PWA INSTALL FLOATING BANNER (แถบแจ้งเตือนติดตั้งแอปบนโทรศัพท์)
       ========================================================================= */
    .pwa-install-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 540px;
      background: rgba(3, 51, 42, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid #E5CCA2;
      border-radius: 18px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.65), 0 0 25px rgba(229, 204, 162, 0.3);
      z-index: 9999999;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      animation: pwaSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .pwa-install-bar.hidden {
      transform: translate(-50%, 150px);
      opacity: 0;
      pointer-events: none;
    }

    @keyframes pwaSlideUp {
      from { transform: translate(-50%, 120px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .pwa-bar-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .pwa-bar-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: contain;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px;
      border: 1px solid rgba(229, 204, 162, 0.4);
    }

    .pwa-bar-text {
      min-width: 0;
    }

    .pwa-bar-title {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pwa-bar-desc {
      font-size: 12px;
      color: #FAF0D7;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pwa-bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pwa-btn-install {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: 50px;
      background: linear-gradient(135deg, #FFF8E7 0%, #FAF0D7 35%, #E5CCA2 70%, #CBB279 100%);
      color: #01231C;
      font-size: 13.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(229, 204, 162, 0.45);
      transition: all 0.2s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      animation: pwaGlowPulse 2.2s infinite ease-in-out;
    }

    .pwa-btn-install:active {
      transform: scale(0.96);
    }

    .pwa-btn-install svg {
      width: 16px;
      height: 16px;
      stroke: #01231C;
      stroke-width: 2.2;
      fill: none;
    }

    @keyframes pwaGlowPulse {
      0% { box-shadow: 0 0 0 0 rgba(229, 204, 162, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(229, 204, 162, 0); }
      100% { box-shadow: 0 0 0 0 rgba(229, 204, 162, 0); }
    }

    .pwa-btn-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #9CA3AF;
      font-size: 15px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .pwa-btn-close:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
    }

    /* ปุ่มลอยติดตั้งในมุมจอ (Floating Action Button เมื่อปิดแถบหลัก) */
    .pwa-fab-btn {
      position: fixed;
      bottom: 24px;
      right: 20px;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 50px;
      background: linear-gradient(135deg, #FFF8E7 0%, #FAF0D7 35%, #E5CCA2 70%, #CBB279 100%);
      color: #01231C;
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid #FAF0D7;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(229, 204, 162, 0.4);
      z-index: 999999;
      animation: pwaGlowPulse 2.2s infinite ease-in-out;
      -webkit-tap-highlight-color: transparent;
    }

    .pwa-fab-btn:active {
      transform: scale(0.96);
    }

    .pwa-fab-btn svg {
      width: 16px;
      height: 16px;
      stroke: #01231C;
      stroke-width: 2.2;
      fill: none;
    }

    /* =========================================================================
       PWA GUIDE MODAL (หน้าต่างแนะนำขั้นตอนการติดตั้งสำหรับ iOS / Android)
       ========================================================================= */
    .pwa-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10000000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .pwa-modal-backdrop.show {
      display: flex;
      opacity: 1;
    }

    .pwa-modal-card {
      background: #03332A;
      border: 1.5px solid #E5CCA2;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(229, 204, 162, 0.25);
      animation: pwaModalPop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pwaModalPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .pwa-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(229, 204, 162, 0.2);
    }

    .pwa-modal-steps {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .pwa-step-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: rgba(1, 35, 28, 0.7);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pwa-step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #E5CCA2;
      color: #01231C;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .pwa-step-text {
      font-size: 13.5px;
      color: #FFFFFF;
      line-height: 1.5;
    }

    .pwa-step-text strong {
      color: #FAF0D7;
    }

    .pwa-modal-btn-ok {
      width: 100%;
      padding: 12px;
      border-radius: 50px;
      background: linear-gradient(135deg, #FFF8E7 0%, #FAF0D7 35%, #E5CCA2 70%, #CBB279 100%);
      color: #01231C;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(229, 204, 162, 0.4);
      transition: all 0.2s;
    }

    .pwa-modal-btn-ok:active {
      transform: scale(0.97);
    }
  </style>
</head>

  <script>
    // ตรวจสอบ Parameter URL
    (function() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        const frame = document.getElementById('ocaFrame');
        if (frame && page && page !== 'welcome') {
          frame.src = 'https://script.google.com/macros/s/AKfycbxkC3uubyG3GELrSRW-DEGTH3gHWyM5oyJXUTAD1Dio__ItmwCkm-rwxGtOFNpSkH04WQ/exec?page=' + encodeURIComponent(page);
        }
      } catch (e) {
        console.error('URL Param Error:', e);
      }
    })();

    // =========================================================================
    // PWA INSTALLATION CONTROLLER (Android Chrome, iOS Safari, Desktop)
    // =========================================================================
    let deferredPrompt = null;
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    // หากเปิดในโหมดติดตั้งแล้ว (Standalone PWA) ซ่อนแถบติดตั้งอัตโนมัติ
    if (isStandalone) {
      const bar = document.getElementById('pwaInstallBar');
      if (bar) bar.style.display = 'none';
    }

    // ดักจับ Native BeforeInstallPrompt (สำหรับ Android Chrome / Chromium)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const bar = document.getElementById('pwaInstallBar');
      if (bar && !isStandalone) bar.classList.remove('hidden');
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      dismissPwaBar();
      console.log('OCA PWA installed successfully');
    });

    // ฟังก์ชันสั่งติดตั้งแอปพลิเคชัน
    function triggerPwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            dismissPwaBar();
          }
          deferredPrompt = null;
        });
        return;
      }

      // กรณีบน iOS Safari หรือบราวเซอร์ที่ยังไม่เปิด Native Prompt แสดงหน้าต่างคำแนะนำ
      showPwaGuideModal();
    }

    function dismissPwaBar() {
      const bar = document.getElementById('pwaInstallBar');
      const fab = document.getElementById('pwaFabBtn');
      if (bar) bar.classList.add('hidden');
      if (fab && !isStandalone) fab.style.display = 'inline-flex';
    }

    function showPwaGuideModal() {
      const modal = document.getElementById('pwaModal');
      const stepsContainer = document.getElementById('pwaModalSteps');
      if (!modal || !stepsContainer) return;

      if (isIos) {
        stepsContainer.innerHTML = `
          <div class="pwa-step-item">
            <div class="pwa-step-num">1</div>
            <div class="pwa-step-text">แตะที่ปุ่ม <strong>แชร์ (Share)</strong> <span style="font-size:16px;">⎋</span> ที่แถบด้านล่างของ Safari</div>
          </div>
          <div class="pwa-step-item">
            <div class="pwa-step-num">2</div>
            <div class="pwa-step-text">เลื่อนลงมาแล้วเลือก <strong>"เพิ่มไปยังหน้าจอโฮม" (Add to Home Screen)</strong> ➕</div>
          </div>
          <div class="pwa-step-item">
            <div class="pwa-step-num">3</div>
            <div class="pwa-step-text">แตะ <strong>"เพิ่ม" (Add)</strong> มุมขวาบน จะได้ไอคอนแอป OCA บนหน้าจอมือถือทันที!</div>
          </div>
        `;
      } else {
        stepsContainer.innerHTML = `
          <div class="pwa-step-item">
            <div class="pwa-step-num">1</div>
            <div class="pwa-step-text">แตะที่ปุ่ม <strong>เมนูจุดสามจุด (⋮)</strong> มุมขวาบนของเบราว์เซอร์ Chrome</div>
          </div>
          <div class="pwa-step-item">
            <div class="pwa-step-num">2</div>
            <div class="pwa-step-text">เลือก <strong>"ติดตั้งแอปพลิเคชัน" (Install app)</strong> หรือ <strong>"เพิ่มลงในหน้าจอหลัก"</strong> 📲</div>
          </div>
          <div class="pwa-step-item">
            <div class="pwa-step-num">3</div>
            <div class="pwa-step-text">กดยืนยันการติดตั้ง ไอคอนแอป OCA จะปรากฏบนหน้าจอมือถือทันที!</div>
          </div>
        `;
      }

      modal.classList.add('show');
    }

    function closePwaModal(e) {
      if (e && e.target && e.target !== document.getElementById('pwaModal') && !e.target.classList.contains('pwa-btn-close') && !e.target.classList.contains('pwa-modal-btn-ok')) return;
      const modal = document.getElementById('pwaModal');
      if (modal) modal.classList.remove('show');
    }

    // ดักรับสัญญาณสื่อสารจาก iframe ภายใน portal.html
    window.addEventListener('message', (event) => {
      if (event.data && event.data.action === 'triggerPwaInstall') {
        triggerPwaInstall();
      }
    });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator && window.location.protocol === 'https:' && !window.location.hostname.includes('google')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=2.2').catch(function() {});
      });
    }
  </script>
