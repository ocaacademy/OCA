<body>
  <!-- Iframe เชื่อมโยงระบบ Google Apps Script Web App โดยตรง -->
  <iframe id="ocaFrame"
          src="https://script.google.com/macros/s/AKfycbxkC3uubyG3GELrSRW-DEGTH3gHWyM5oyJXUTAD1Dio__ItmwCkm-rwxGtOFNpSkH04WQ/exec?page=dashboard"
          allow="camera; microphone; clipboard-write; fullscreen"
          allowfullscreen>
  </iframe>

  <script>
    // ส่งต่อ Parameter URL เช่น ?page=welcome หรือ ?page=dashboard ไปยัง Iframe โดยอัตโนมัติ
    (function() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        if (page) {
          const frame = document.getElementById('ocaFrame');
          if (frame) {
            frame.src = 'https://script.google.com/macros/s/AKfycbxkC3uubyG3GELrSRW-DEGTH3gHWyM5oyJXUTAD1Dio__ItmwCkm-rwxGtOFNpSkH04WQ/exec?page=' + encodeURIComponent(page);
          }
        }
      } catch (e) {
        console.error('URL Param Error:', e);
      }
    })();

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=2.0')
          .then(reg => {
            console.log('PWA ServiceWorker registered:', reg.scope);
            reg.update();
          })
          .catch(err => console.log('ServiceWorker registration warning:', err));
      });
    }
  </script>
