<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Oriental Culture Academy (東方文化書院)</title>
  
  <!-- Viewport & Mobile Standalone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#01231C">
  
  <!-- Mobile Standalone (Android & iOS) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OCA">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  
  <!-- Favicon & PWA Manifest -->
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="manifest" href="./manifest.json">
  
  <!-- Google Fonts & FontAwesome & jsQR -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #01231C;
      font-family: 'Prompt', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Iframe Shell */
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #03332A 0%, #01231C 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.45));
      animation: pulse 2s infinite ease-in-out;
    }

    .splash-title {
      margin-top: 20px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #FAF0D7;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .splash-sub {
      font-size: 0.88rem;
      color: #E5CCA2;
      margin-top: 6px;
      font-weight: 400;
      text-align: center;
    }

    .spinner {
      margin-top: 26px;
      width: 34px;
      height: 34px;
      border: 3px solid rgba(229, 204, 162, 0.2);
      border-top-color: #FAF0D7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }



    /* Universal PWA Guide Modal */
    #pwa-guide-modal {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 440px;
      background: rgba(3, 51, 42, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 20px 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(229, 204, 162, 0.25);
      z-index: 10000;
      display: none;
      text-align: center;
      border: 1.5px solid rgba(229, 204, 162, 0.5);
    }

    #pwa-guide-modal.show {
      display: block;
      animation: slideUp 0.35s ease;
    }

    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(50px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Loading Splash Screen -->
  <div id="splash-screen">
    <img src="./icon-192.png" alt="OCA Logo" class="splash-logo">
    <div class="splash-title">Oriental Culture Academy</div>
    <div class="splash-sub">東方文化書院 — กำลังเปิดระบบบริหารจัดการ...</div>
    <div class="spinner"></div>
  </div>

  <!-- Google Apps Script Embedded Iframe (Web App) -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxkC3uubyG3GELrSRW-DEGTH3gHWyM5oyJXUTAD1Dio__ItmwCkm-rwxGtOFNpSkH04WQ/exec"
    allow="camera *; microphone *; geolocation *; fullscreen; display-capture *"
    onload="onIframeLoad()"
  ></iframe>

  <!-- Universal PWA Installation Guide Modal (iOS & Android) -->
  <div id="pwa-guide-modal">
    <div id="pwa-guide-title" style="font-weight: 700; font-size: 1rem; margin-bottom: 8px; color: #FAF0D7;">📲 ติดตั้งแอปพลิเคชัน OCA</div>
    <div id="pwa-guide-body" style="font-size: 0.86rem; color: #A7F3D0; line-height: 1.6; text-align: left; margin: 10px 0;"></div>
    <button onclick="document.getElementById('pwa-guide-modal').classList.remove('show')" style="margin-top: 10px; background: rgba(229, 204, 162, 0.2); border: 1px solid rgba(229, 204, 162, 0.4); padding: 8px 24px; border-radius: 12px; font-size: 0.85rem; color: #FAF0D7; cursor: pointer; font-family: inherit; font-weight: 600;">รับทราบ</button>
  </div>

  <!-- High-Fidelity Camera Viewfinder Modal (Bypasses GAS Iframe sandbox) -->
  <div id="oca-camera-modal" style="display:none; position:fixed; inset:0; z-index:99999; background:rgba(1,35,28,0.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); flex-direction:column; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#03332A; border:1.5px solid #D7A600; border-radius:20px; width:100%; max-width:440px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(215,166,0,0.25); display:flex; flex-direction:column;">
      
      <!-- Modal Header -->
      <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid rgba(229,204,162,0.2); background:rgba(1,35,28,0.5);">
        <div style="display:flex; align-items:center; gap:10px;">
          <span id="oca-modal-icon" style="display:inline-flex; width:32px; height:32px; border-radius:50%; background:rgba(215,166,0,0.2); align-items:center; justify-content:center; color:#D7A600; font-size:16px;">📷</span>
          <div>
            <div id="oca-modal-title" style="font-size:15px; font-weight:700; color:#FAF0D7;">ถ่ายภาพนักศึกษา (OCA Camera)</div>
            <div id="oca-modal-subtitle" style="font-size:11px; color:#A7F3D0;">จัดศีรษะและหัวไหล่ในกรอบ (หน้าตรงครึ่งตัว)</div>
          </div>
        </div>
        <button id="btnModalCloseCam" style="background:none; border:none; color:#FAF0D7; font-size:22px; cursor:pointer; padding:4px 8px; line-height:1;" title="ปิดกล้อง">✕</button>
      </div>

      <!-- Viewfinder Box (3:4 aspect ratio with bust shot or QR guide) -->
      <div style="position:relative; width:100%; padding-top:125%; background:#000; overflow:hidden;">
        <video id="oca-top-video" autoplay playsinline muted style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;"></video>
        
        <!-- Mode 1: Full Bust Shot (Head & Shoulders) Silhouette Guide -->
        <div id="oca-guide-oval" style="position:absolute; inset:0; pointer-events:none;">
          <svg viewBox="0 0 300 400" style="width:100%; height:100%; display:block;" preserveAspectRatio="none">
            <!-- Semi-transparent Vignette Mask -->
            <defs>
              <mask id="portrait-mask">
                <rect width="300" height="400" fill="white"/>
                <!-- Head cutout -->
                <ellipse cx="150" cy="130" rx="55" ry="75" fill="black"/>
                <!-- Neck & Shoulders cutout -->
                <path d="M 120 195 C 105 225, 40 250, 10 305 L 10 400 L 290 400 L 290 305 C 260 250, 195 225, 180 195 Z" fill="black"/>
              </mask>
            </defs>
            <rect width="300" height="400" fill="rgba(0,0,0,0.35)" mask="url(#portrait-mask)"/>

            <!-- Head outline (Gold dashed) -->
            <ellipse cx="150" cy="130" rx="55" ry="75" fill="none" stroke="#D7A600" stroke-width="2.5" stroke-dasharray="6,4"/>
            <!-- Eye level guide line -->
            <line x1="115" y1="125" x2="185" y2="125" stroke="rgba(229,204,162,0.4)" stroke-width="1.5" stroke-dasharray="3,3"/>
            <!-- Shoulders & Upper Chest outline (Gold dashed) -->
            <path d="M 120 195 C 105 225, 40 250, 10 305 L 10 400 M 180 195 C 195 225, 260 250, 290 305 L 290 400" fill="none" stroke="#D7A600" stroke-width="2.5" stroke-dasharray="6,4"/>
            <!-- Text label -->
            <text x="150" y="380" fill="#FAF0D7" font-size="12" font-weight="700" text-anchor="middle" style="text-shadow:0 1px 4px rgba(0,0,0,0.9); font-family:sans-serif;">
              รูปถ่ายหน้าตรง ครึ่งตัว (ศีรษะถึงระดับอก/ไหล่)
            </text>
          </svg>
        </div>

        <!-- Mode 2: Square QR Scanner Reticle Overlay -->
        <div id="oca-guide-qr" style="display:none; position:absolute; top:18%; bottom:18%; left:12%; right:12%; border:2px solid #10B981; border-radius:16px; pointer-events:none; box-shadow:0 0 0 9999px rgba(0,0,0,0.45);">
          <div style="position:absolute; inset:0; border:2px dashed rgba(255,255,255,0.35); border-radius:14px;"></div>
          <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#FAF0D7; font-size:12px; font-weight:700; text-align:center; text-shadow:0 1px 4px rgba(0,0,0,0.9); width:100%;">
            ส่องกล้องไปที่ QR บนใบเสร็จ
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div style="padding:14px 18px; display:flex; gap:10px; align-items:center; justify-content:center; background:#01231C; border-top:1px solid rgba(229,204,162,0.15);">
        <!-- Switch Camera (Mobile) -->
        <button id="btnModalSwitchCam" type="button" style="background:rgba(255,255,255,0.08); border:1px solid rgba(229,204,162,0.4); color:#FAF0D7; padding:10px 14px; border-radius:12px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; font-family:inherit;">
          🔄 สลับกล้อง
        </button>

        <!-- Shutter Button (Visible in photo mode) -->
        <button id="btnModalSnap" type="button" style="flex:1; background:linear-gradient(135deg, #D7A600 0%, #B8860B 100%); border:none; color:#01231C; padding:11px 18px; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 4px 15px rgba(215,166,0,0.4); font-family:inherit;">
          📸 ถ่ายภาพ
        </button>
      </div>
    </div>
  </div>
  <canvas id="oca-top-canvas" style="display:none;"></canvas>

  <script>
    // ซ่อนหน้า Splash เมื่อ Iframe โหลดเสร็จ หรือ Safety Timeout
    let splashHidden = false;
    function hideSplash() {
      if (splashHidden) return;
      splashHidden = true;
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.transition = 'opacity 0.3s ease';
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(() => {
          splash.style.display = 'none';
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 300);
      }
    }

    function onIframeLoad() {
      hideSplash();
    }

    // Safety Timeout ป้องกันค้าง (ปลดล็อกอัตโนมัติภายใน 1.5 วินาที)
    setTimeout(() => {
      hideSplash();
    }, 1500);

    // แตะหน้าจอเพื่อเปิดเข้าสู่ระบบได้ทันที (Tap to Dismiss Fallback)
    window.addEventListener('click', () => hideSplash(), { once: true, passive: true });
    window.addEventListener('touchstart', () => hideSplash(), { once: true, passive: true });

    // ลงทะเบียน Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker Registered:', reg.scope))
          .catch((err) => console.error('Service Worker Error:', err));
      });
    }

    // ตรวจสอบอุปกรณ์ iOS และ Standalone mode
    const isIos = () => {
      const userAgent = window.navigator.userAgent.toLowerCase();
      return /iphone|ipad|ipod/.test(userAgent);
    };
    const isInStandaloneMode = () => ('standalone' in window.navigator && window.navigator.standalone) || 
                                     window.matchMedia('(display-mode: standalone)').matches;

    // จัดการ Event ติดตั้งแอป (Android Chrome) - เก็บ Event รอรับการกดจากปุ่มหน้า Welcome
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('beforeinstallprompt captured and ready for Welcome button');
    });

    // ฟังก์ชันแสดงหน้าต่างคำแนะนำการติดตั้ง
    function showPwaGuide(title, htmlBody) {
      const modal = document.getElementById('pwa-guide-modal');
      const titleEl = document.getElementById('pwa-guide-title');
      const bodyEl = document.getElementById('pwa-guide-body');
      if (modal && titleEl && bodyEl) {
        titleEl.textContent = title;
        bodyEl.innerHTML = htmlBody;
        modal.classList.add('show');
      }
    }

    // ===== TOP-LEVEL CAMERA & QR SCANNER BRIDGE =====
    let topCameraStream = null;
    let cameraRequester = null;
    let cameraPort = null;
    let currentCameraMode = 'photo'; // 'photo' หรือ 'qr'
    let currentFacingMode = 'user';
    let qrScanAnimationId = null;

    function playBeepSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.25;
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 120);
      } catch (_) {}
    }

    async function startTopCamera(mode = 'photo', facingMode = null) {
      currentCameraMode = mode;
      currentFacingMode = facingMode || (mode === 'qr' ? 'environment' : 'user');

      const modal = document.getElementById('oca-camera-modal');
      const video = document.getElementById('oca-top-video');
      const titleEl = document.getElementById('oca-modal-title');
      const subtitleEl = document.getElementById('oca-modal-subtitle');
      const iconEl = document.getElementById('oca-modal-icon');
      const ovalGuide = document.getElementById('oca-guide-oval');
      const qrGuide = document.getElementById('oca-guide-qr');
      const snapBtn = document.getElementById('btnModalSnap');

      if (mode === 'qr') {
        if (titleEl) titleEl.textContent = 'สแกนเนอร์รับตำราเรียน (Textbook QR Scanner)';
        if (subtitleEl) subtitleEl.textContent = 'ส่องกล้องไปที่ QR Code บนใบเสร็จ';
        if (iconEl) iconEl.textContent = '📱';
        if (ovalGuide) ovalGuide.style.display = 'none';
        if (qrGuide) qrGuide.style.display = 'block';
        if (snapBtn) snapBtn.style.display = 'none';
      } else {
        if (titleEl) titleEl.textContent = 'ถ่ายภาพนักศึกษา (OCA Camera)';
        if (subtitleEl) subtitleEl.textContent = 'จัดตำแหน่งศีรษะให้อยู่ในกรอบวงรี';
        if (iconEl) iconEl.textContent = '📷';
        if (ovalGuide) ovalGuide.style.display = 'block';
        if (qrGuide) qrGuide.style.display = 'none';
        if (snapBtn) {
          snapBtn.style.display = 'flex';
          snapBtn.innerHTML = '📸 ถ่ายภาพ';
          snapBtn.style.background = 'linear-gradient(135deg, #D7A600 0%, #B8860B 100%)';
        }
      }

      if (topCameraStream) {
        topCameraStream.getTracks().forEach(t => t.stop());
        topCameraStream = null;
      }
      if (qrScanAnimationId) {
        cancelAnimationFrame(qrScanAnimationId);
        qrScanAnimationId = null;
      }

      try {
        const constraints = {
          video: {
            facingMode: { ideal: currentFacingMode },
            width: { ideal: 1280 },
            height: { ideal: 960 }
          },
          audio: false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        topCameraStream = stream;
        video.srcObject = stream;
        video.style.transform = (currentFacingMode === 'user') ? 'scaleX(-1)' : 'none';
        modal.style.display = 'flex';
        await video.play();

        if (mode === 'qr') {
          scanQrLoop();
        }
      } catch (err) {
        console.warn('Top camera start error:', err);
        alert('ไม่สามารถเปิดกล้องได้: ' + (err.message || 'กรุณาอนุญาตสิทธิ์การเข้าถึงกล้องในเบราว์เซอร์'));
        stopTopCamera();
      }
    }

    function stopTopCamera() {
      if (topCameraStream) {
        topCameraStream.getTracks().forEach(t => t.stop());
        topCameraStream = null;
      }
      if (qrScanAnimationId) {
        cancelAnimationFrame(qrScanAnimationId);
        qrScanAnimationId = null;
      }
      const modal = document.getElementById('oca-camera-modal');
      if (modal) modal.style.display = 'none';
      const video = document.getElementById('oca-top-video');
      if (video) video.srcObject = null;
    }

    // QR Detection Loop (Textbooks Module)
    let qrDetectorInstance = null;
    if ('BarcodeDetector' in window) {
      try {
        qrDetectorInstance = new BarcodeDetector({ formats: ['qr_code'] });
      } catch (_) {}
    }

    async function scanQrLoop() {
      if (!topCameraStream || currentCameraMode !== 'qr') return;
      const video = document.getElementById('oca-top-video');
      if (!video || video.readyState < 2) {
        qrScanAnimationId = requestAnimationFrame(scanQrLoop);
        return;
      }

      let detectedValue = null;

      // 1. Try Native BarcodeDetector (Chrome/Edge/Android)
      if (qrDetectorInstance) {
        try {
          const codes = await qrDetectorInstance.detect(video);
          if (codes && codes.length > 0 && codes[0].rawValue) {
            detectedValue = codes[0].rawValue;
          }
        } catch (_) {}
      }

      // 2. Fallback to jsQR
      if (!detectedValue && typeof jsQR !== 'undefined') {
        const canvas = document.getElementById('oca-top-canvas');
        if (canvas) {
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imgData.data, imgData.width, imgData.height);
          if (code && code.data) detectedValue = code.data;
        }
      }

      if (detectedValue) {
        playBeepSound();
        const subtitleEl = document.getElementById('oca-modal-subtitle');
        if (subtitleEl) {
          subtitleEl.innerHTML = `<span style="color:#10B981; font-weight:700;">✅ สแกนสำเร็จ: ${detectedValue}</span>`;
        }

        // Send token to portal via MessageChannel port & e.source
        if (cameraPort) {
          cameraPort.postMessage({ action: 'OCA_QR_SCANNED', token: detectedValue });
        }
        if (cameraRequester && typeof cameraRequester.postMessage === 'function') {
          try {
            cameraRequester.postMessage({ action: 'OCA_QR_SCANNED', token: detectedValue }, '*');
          } catch (_) {}
        }
        const appFrame = document.getElementById('app-frame');
        if (appFrame && appFrame.contentWindow) {
          try {
            appFrame.contentWindow.postMessage({ action: 'OCA_QR_SCANNED', token: detectedValue }, '*');
          } catch (_) {}
        }

        setTimeout(() => stopTopCamera(), 400);
        return;
      }

      qrScanAnimationId = requestAnimationFrame(scanQrLoop);
    }

    // Photo Snap Capture (Student Registration)
    function captureTopPhoto() {
      const video = document.getElementById('oca-top-video');
      const canvas = document.getElementById('oca-top-canvas');
      const snapBtn = document.getElementById('btnModalSnap');
      if (!video || !canvas) return;

      const vw = video.videoWidth || 640;
      const vh = video.videoHeight || 480;

      let cropW, cropH, startX, startY;
      const targetRatio = 3 / 4;
      const videoRatio = vw / vh;

      if (videoRatio > targetRatio) {
        cropH = vh;
        cropW = Math.round(vh * targetRatio);
        startX = Math.round((vw - cropW) / 2);
        startY = 0;
      } else {
        cropW = vw;
        cropH = Math.round(vw / targetRatio);
        startX = 0;
        startY = Math.round((vh - cropH) / 2);
      }

      canvas.width = 480;
      canvas.height = 640;
      const ctx = canvas.getContext('2d');

      if (currentFacingMode === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }

      ctx.drawImage(video, startX, startY, cropW, cropH, 0, 0, canvas.width, canvas.height);
      const dataUri = canvas.toDataURL('image/jpeg', 0.90);

      // Visual feedback: green confirmation
      if (snapBtn) {
        snapBtn.innerHTML = '✅ บันทึกภาพเรียบร้อย';
        snapBtn.style.background = '#10B981';
      }

      // Send to portal via MessageChannel port & e.source
      if (cameraPort) {
        cameraPort.postMessage({
          action: 'OCA_CAMERA_PHOTO_CAPTURED',
          dataUri: dataUri
        });
      }
      if (cameraRequester && typeof cameraRequester.postMessage === 'function') {
        try {
          cameraRequester.postMessage({
            action: 'OCA_CAMERA_PHOTO_CAPTURED',
            dataUri: dataUri
          }, '*');
        } catch (_) {}
      }
      const appFrame = document.getElementById('app-frame');
      if (appFrame && appFrame.contentWindow) {
        try {
          appFrame.contentWindow.postMessage({
            action: 'OCA_CAMERA_PHOTO_CAPTURED',
            dataUri: dataUri
          }, '*');
        } catch (_) {}
      }

      setTimeout(() => stopTopCamera(), 350);
    }

    // Modal Events
    document.getElementById('btnModalCloseCam')?.addEventListener('click', stopTopCamera);
    document.getElementById('btnModalSnap')?.addEventListener('click', captureTopPhoto);
    document.getElementById('btnModalSwitchCam')?.addEventListener('click', () => {
      startTopCamera(currentCameraMode, currentFacingMode === 'user' ? 'environment' : 'user');
    });

    // รับคำสั่งสื่อสารจากหน้า Portal ภายใน Iframe
    window.addEventListener('message', async (e) => {
      if (!e.data) return;

      // 1. ปลดหน้าจอ Splash Screen ทันทีที่ Portal เริ่มทำงาน
      if (e.data.action === 'PORTAL_READY' || e.data.action === 'HIDE_SPLASH') {
        hideSplash();
        return;
      }

      // 2. รับคำสั่งเปิดกล้องถ่ายภาพนักศึกษา
      if (e.data.action === 'OCA_REQUEST_CAMERA') {
        cameraRequester = e.source;
        cameraPort = (e.ports && e.ports[0]) || null;
        startTopCamera('photo', 'user');
        return;
      }

      // 3. รับคำสั่งเปิดกล้องสแกนเนอร์รับตำราเรียน
      if (e.data.action === 'OCA_REQUEST_QR_SCANNER') {
        cameraRequester = e.source;
        cameraPort = (e.ports && e.ports[0]) || null;
        startTopCamera('qr', 'environment');
        return;
      }

      // 3. รับคำสั่งคลิกปุ่มติดตั้ง PWA จากหน้า Welcome (Single Install Button)
      if (e.data.action === 'TRIGGER_PWA_INSTALL') {
        console.log('Received TRIGGER_PWA_INSTALL from portal. deferredPrompt ready:', !!deferredPrompt);
        if (isInStandaloneMode()) {
          showPwaGuide(
            '✅ แอป OCA ติดตั้งเรียบร้อยแล้ว',
            'แอปพลิเคชัน OCA ได้รับการติดตั้งบนหน้าจอโทรศัพท์ของคุณแล้ว สามารถเปิดใช้งานผ่านไอคอนบนหน้าจอหลักได้โดยตรง'
          );
          return;
        }

        if (deferredPrompt) {
          try {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response to install: ${outcome}`);
            deferredPrompt = null;
          } catch (err) {
            console.warn('Install prompt error:', err);
          }
        } else if (isIos()) {
          showPwaGuide(
            '📲 วิธีติดตั้งบน iPhone / iPad',
            '1. แตะปุ่มแชร์ <i class="fa-solid fa-arrow-up-from-bracket" style="color:#FAF0D7; margin:0 4px;"></i> ที่แถบล่าง Safari<br>2. เลื่อนลงแล้วเลือก <b>"เพิ่มไปยังหน้าจอโฮม (Add to Home Screen)"</b>'
          );
        } else {
          showPwaGuide(
            '📲 วิธีติดตั้งแอป OCA บน Android',
            '1. แตะปุ่มเมนู <b>3 จุด (⋮)</b> ที่มุมขวาบนของเบราว์เซอร์<br>2. เลือก <b>"ติดตั้งแอป (Install app)"</b> หรือ <b>"เพิ่มลงในหน้าจอหลัก (Add to Home screen)"</b>'
          );
        }
      }
    });
  </script>
</body>
</html>
