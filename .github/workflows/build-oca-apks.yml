name: Build OCA Android APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore oca-release.jks -alias oca -keyalg RSA -keysize 2048 -validity 10000 -storepass oca2569pass -keypass oca2569pass -dname "CN=Oriental Culture Academy, O=OCA, C=TH"

      - name: Build OCA Staff & Student APKs
        run: |
          mkdir -p out-apks
          for TARGET in "staff|OCA|com.ocaacademy.staff|https://ocaacademy.github.io/OCA/|icon-512.png|OCA-Staff.apk" "student|OCA Student|com.ocaacademy.student|https://ocaacademy.github.io/OCA/student/|student-icon-512.png|OCA-Student.apk"; do
            IFS='|' read -r ID LABEL PKG URL ICON OUT_NAME <<< "$TARGET"
            DIR="app-$ID"
            rm -rf "$DIR"
            mkdir -p "$DIR/app/src/main/java/${PKG//./\/}" "$DIR/app/src/main/res/mipmap-xxxhdpi" "$DIR/app/src/main/res/values"
            cp "$ICON" "$DIR/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"

            cat > "$DIR/settings.gradle" << 'EOF'
rootProject.name = "OCAApp"
include ':app'
EOF
            cat > "$DIR/build.gradle" << 'EOF'
buildscript {
  repositories { google(); mavenCentral() }
  dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
}
allprojects { repositories { google(); mavenCentral() } }
EOF
            cat > "$DIR/app/build.gradle" << EOF
apply plugin: 'com.android.application'
android {
  namespace '$PKG'
  compileSdk 34
  defaultConfig {
    applicationId "$PKG"
    minSdk 24
    targetSdk 34
    versionCode 393
    versionName "3.9.3"
  }
  signingConfigs {
    release {
      storeFile file('../../oca-release.jks')
      storePassword 'oca2569pass'
      keyAlias 'oca'
      keyPassword 'oca2569pass'
    }
  }
  buildTypes {
    release {
      signingConfig signingConfigs.release
      minifyEnabled false
    }
  }
}
EOF
            cat > "$DIR/app/src/main/res/values/strings.xml" << EOF
<resources><string name="app_name">$LABEL</string></resources>
EOF
            cat > "$DIR/app/src/main/AndroidManifest.xml" << EOF
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
  <uses-permission android:name="android.permission.INTERNET" />
  <uses-permission android:name="android.permission.CAMERA" />
  <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.NoTitleBar" android:usesCleartextTraffic="false">
    <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
      <intent-filter>
        <action android:name="android.intent.action.MAIN" />
        <category android:name="android.intent.category.LAUNCHER" />
      </intent-filter>
    </activity>
  </application>
</manifest>
EOF
            cat > "$DIR/app/src/main/java/${PKG//./\/}/MainActivity.java" << EOF
package $PKG;
import android.app.Activity;
import android.content.Intent;
import android.net.Uri;
import android.os.Bundle;
import android.webkit.*;

public class MainActivity extends Activity {
  private WebView webView;
  private ValueCallback<Uri[]> fileCallback;
  @Override
  protected void onCreate(Bundle savedInstanceState) {
    super.onCreate(savedInstanceState);
    webView = new WebView(this);
    setContentView(webView);
    WebSettings s = webView.getSettings();
    s.setJavaScriptEnabled(true);
    s.setDomStorageEnabled(true);
    s.setAllowFileAccess(true);
    s.setMediaPlaybackRequiresUserGesture(false);
    webView.setWebViewClient(new WebViewClient() {
      @Override
      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
        String u = req.getUrl().toString();
        if (u.startsWith("https://ocaacademy.github.io/OCA/")) return false;
        startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u)));
        return true;
      }
    });
    webView.setWebChromeClient(new WebChromeClient() {
      @Override
      public void onPermissionRequest(PermissionRequest r) { r.grant(r.getResources()); }
      @Override
      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
        fileCallback = cb;
        startActivityForResult(p.createIntent(), 1001);
        return true;
      }
    });
    webView.loadUrl("$URL");
  }
  @Override
  protected void onActivityResult(int req, int res, Intent data) {
    if (req == 1001 && fileCallback != null) {
      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
      fileCallback = null;
    }
  }
  @Override
  public void onBackPressed() {
    if (webView != null && webView.canGoBack()) webView.goBack();
    else super.onBackPressed();
  }
}
EOF
            gradle -p "$DIR" assembleRelease
            cp "$DIR/app/build/outputs/apk/release/app-release.apk" "out-apks/$OUT_NAME"
          done

      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: OCA Android APKs (Latest)
          files: |
            out-apks/OCA-Staff.apk
            out-apks/OCA-Student.apk
